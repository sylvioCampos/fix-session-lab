# Drop-copy client — one initiator session, read-only.
#
# Password is read from FIXLAB_DCCLIENT_PASSWORD.

[default]
ConnectionType=initiator
BeginString=FIX.4.4

SocketConnectHost=127.0.0.1
SocketConnectPort=9876

ReconnectInterval=3
SocketKeepAlive=Y
HeartBtInt=30

StartTime=00:00:00
EndTime=00:00:00
NonStopSession=Y

ResetOnLogon=Y
ResetOnLogout=N
ResetOnDisconnect=N

UseDataDictionary=Y
DataDictionary=spec/FIX44-fixlab.xml
ValidateUserDefinedFields=Y
ValidateIncomingMessage=Y

# N, unlike the order-entry session. A drop-copy session must send only
# session-level admin traffic. With Y, quickfixgo answers any message that fails
# dictionary validation with a session Reject (35=3) — breaking the read-only
# invariant the moment a venue emits a tag its own spec did not document, which
# venues do. N keeps validation on so anomalies are still logged, and suppresses
# the automatic reply.
RejectInvalidMessage=N

PersistMessages=Y
FileStorePath=/data/store
LogoutTimeout=5
CheckLatency=N
MaxMessagesInResendRequest=10000

[session]
SenderCompID=DCCLIENT
TargetCompID=FIXLABEX
