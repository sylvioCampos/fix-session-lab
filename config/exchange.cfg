# Fake venue — two acceptor sessions in one process.
#
# Both sessions listen on the same port. quickfixgo routes an inbound
# connection to a session by the CompIDs on its Logon, so one listener serves
# both roles. Real venues usually give each service its own port; either works,
# and doing it this way keeps the compose file to one exposed port.
#
# This file contains NO passwords. The venue reads the password it expects for a
# counterparty from FIXLAB_<TargetCompID>_PASSWORD. If that variable is unset,
# the venue accepts any password, so a first run works before the reader has
# configured anything.

[default]
ConnectionType=acceptor
BeginString=FIX.4.4
SocketAcceptPort=9876

# Continuous session. StartTime equal to EndTime with NonStopSession=Y means the
# session never rolls, so a drill is never interrupted by a scheduled reset.
StartTime=00:00:00
EndTime=00:00:00
NonStopSession=Y

HeartBtInt=30

# The venue never initiates a reset. Sequence continuity is the client's to
# manage, and every recovery drill depends on the venue not silently fixing it.
ResetOnLogon=N
ResetOnLogout=N
ResetOnDisconnect=N

UseDataDictionary=Y
DataDictionary=spec/FIX44-fixlab.xml
# The custom tags are declared in the dictionary, so leave validation on. See
# spec/README.md for what was added and why.
ValidateUserDefinedFields=Y
ValidateIncomingMessage=Y
RejectInvalidMessage=Y

PersistMessages=Y
FileStorePath=/data/store

# Order entry — read/write. Accepts NewOrderSingle, emits ExecutionReports.
[session]
SenderCompID=FIXLABEX
TargetCompID=OECLIENT
SessionKind=ORDER_ENTRY

# Drop copy — read-only. Receives a copy of every ExecutionReport the venue
# publishes, and rejects any application message sent to it.
[session]
SenderCompID=FIXLABEX
TargetCompID=DCCLIENT
SessionKind=DROP_COPY
