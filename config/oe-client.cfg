# Order-entry client — one initiator session.
#
# One session per process is a hard invariant in this lab, not a preference.
# quickfixgo has no per-session disconnect, and Initiator.Stop() unregisters
# every session it owns, so recycling one session means recycling the whole
# Initiator. That is only safe when the Initiator owns exactly one session.
#
# NO passwords here. The password is read from FIXLAB_OECLIENT_PASSWORD and
# injected into RawData (96) on every outbound Logon.

[default]
ConnectionType=initiator
BeginString=FIX.4.4

SocketConnectHost=127.0.0.1
SocketConnectPort=9876

# Retry every 3 seconds. quickfixgo reconnects on its own after a connection
# failure; it does not reconnect after a graceful Logout, which is the Go
# equivalent of the QuickFIX/J logout-versus-disconnect trap. See drill 09.
ReconnectInterval=3
SocketKeepAlive=Y
HeartBtInt=30

StartTime=00:00:00
EndTime=00:00:00
NonStopSession=Y

# Y for the very first connect — neither side has a stored sequence number, and
# a clean handshake avoids a spurious gap. Flip to N once the session is stable;
# the gap-recovery drill requires N, because Y would reset the sequence numbers
# and erase the gap you are trying to recover from.
ResetOnLogon=Y
ResetOnLogout=N
ResetOnDisconnect=N

UseDataDictionary=Y
DataDictionary=spec/FIX44-fixlab.xml
ValidateUserDefinedFields=Y
ValidateIncomingMessage=Y
RejectInvalidMessage=Y

PersistMessages=Y
FileStorePath=/data/store
LogoutTimeout=5
CheckLatency=N

# Venues cap how many messages a single ResendRequest may cover. Setting the cap
# here makes quickfixgo chunk a large replay into batches instead of asking for
# a range the venue will refuse.
MaxMessagesInResendRequest=10000

[session]
SenderCompID=OECLIENT
TargetCompID=FIXLABEX
